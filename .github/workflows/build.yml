name: Build apps

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --windowed --name SmartSchoolFiller main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SmartSchoolFiller-${{ runner.os }}
          path: dist/
